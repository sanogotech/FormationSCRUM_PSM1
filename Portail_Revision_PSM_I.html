<title>Portail de révision PSM I</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout : tableau de Sprint — bandeau d'en-tête avec onglets défilants, panneau de travail à 1100 px ; les termes anglais de l'examen sont surlignés au marqueur, la jauge 85 % sert de fil rouge visuel */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E5ECEA; --ink:#13231F; --muted:#556A65; --line:#D2DDDA;
  --accent:#0B6E63; --accent-ink:#FFFFFF; --accent-soft:#DCEFEB;
  --kw:#FFE08A; --kw-ink:#3A2A00;
  --ok:#147A4B; --ok-soft:#DDF2E7; --bad:#B42318; --bad-soft:#FBE3E0; --warn:#9A5B00; --warn-soft:#FDF0D8;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1614; --surface:#14201D; --sunk:#1B2B27; --ink:#E3EEEB; --muted:#98ADA8; --line:#28403A;
  --accent:#5ED1BF; --accent-ink:#06201B; --accent-soft:#163A34;
  --kw:#5C4A12; --kw-ink:#FFE7A3;
  --ok:#5BD39A; --ok-soft:#12321F; --bad:#FF8A7E; --bad-soft:#3A1916; --warn:#F5B95A; --warn-soft:#3A2A10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#14201D; --sunk:#1B2B27; --ink:#E3EEEB; --muted:#98ADA8; --line:#28403A;
  --accent:#5ED1BF; --accent-ink:#06201B; --accent-soft:#163A34;
  --kw:#5C4A12; --kw-ink:#FFE7A3;
  --ok:#5BD39A; --ok-soft:#12321F; --bad:#FF8A7E; --bad-soft:#3A1916; --warn:#F5B95A; --warn-soft:#3A2A10; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.01em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:13.5px}
nav.tabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:thin}
nav.tabs button{flex:none;font:600 14px var(--f-body);border:1px solid transparent;background:none;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs button .new{font:600 10px var(--f-mono);color:var(--accent);margin-left:4px;vertical-align:1px}
nav.tabs button[aria-current="page"] .new{color:var(--bg);opacity:.8}
button:focus-visible,select:focus-visible,input:focus-visible,.opt:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
h2{font-size:24px;font-weight:750;letter-spacing:-.01em}
h3{font-size:17.5px;font-weight:700}
.lede{color:var(--muted);max-width:68ch;margin:10px 0 0}
.eyebrow{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kw{background:linear-gradient(transparent 12%,var(--kw) 12%,var(--kw) 88%,transparent 88%);color:var(--kw-ink);padding:0 3px;border-radius:2px;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.mono{font-family:var(--f-mono)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{font:600 14.5px var(--f-body);border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13.5px}
.chip{font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.label{font:700 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:110px}
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:end;margin-bottom:24px}
.hero > *{min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:800 26px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.innov{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:0 0 28px}
.innov button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.innov button:hover{border-color:var(--accent)}
.innov button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.innov .n{font:600 11px var(--f-mono);color:var(--accent);letter-spacing:.06em}
.innov b{font:700 16px var(--f-display)}
.innov span{font-size:13.5px;color:var(--muted)}
.twocol{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:28px}
.twocol > *{min-width:0}
.mastery{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.mrow{display:grid;grid-template-columns:150px 1fr 74px;gap:10px;align-items:center;font-size:13.5px}
.mrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{position:relative;height:10px;background:var(--sunk);border-radius:5px;overflow:visible}
.mbar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.mbar i.lo{background:var(--bad)} .mbar i.mid{background:var(--warn)}
.mbar::after{content:"";position:absolute;left:85%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.mrow .v{font:500 12.5px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.predict{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:6px}
.predict b{font:800 40px var(--f-display);font-variant-numeric:tabular-nums;line-height:1}
.plan{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pday{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pday input{width:18px;height:18px;accent-color:var(--accent)}
.pday .d{font:600 12px var(--f-mono);color:var(--accent)}
.pday.done{opacity:.6}
.pday.done .t{text-decoration:line-through}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.dcard .num{font:500 12px var(--f-mono);color:var(--muted);display:flex;justify-content:space-between}
.dcard h3{flex:1}
.wbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--accent)}
.scores{display:flex;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.scores b{color:var(--ink)}
.dcard .row{margin-top:auto}
.setup{display:flex;flex-direction:column;gap:14px}
.setup .row{align-items:flex-start}
.setup .chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:500 12.5px var(--f-mono);color:var(--muted)}
.qtype{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);color:var(--muted);padding:2px 7px;border-radius:4px;margin-bottom:6px}
.qtext{font-size:18.5px;font-weight:600;line-height:1.45;margin:4px 0 16px;max-width:75ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:16px/1.45 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font:600 13px var(--f-mono);border:1px solid var(--line);border-radius:5px;min-width:26px;height:26px;display:grid;place-items:center;flex:none;color:var(--muted)}
.opt.multi .k{border-radius:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.conf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-size:13.5px;color:var(--muted)}
.feedback{margin-top:16px;border-radius:8px;padding:14px 16px;border:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.feedback .verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--bad)}
.rex{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14.5px}
.rex b{color:var(--warn);font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.result-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:124px;height:124px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none;position:relative}
.ring b{width:96px;height:96px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 28px var(--f-display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:700 12.5px var(--f-body);padding:3px 9px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ko{background:var(--bad-soft);color:var(--bad)} .pill.mid{background:var(--warn-soft);color:var(--warn)}
.calib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.calib div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.calib b{font:800 24px var(--f-display);display:block;font-variant-numeric:tabular-nums}
.calib span{font-size:13px;color:var(--muted)}
.calib .danger{border-color:var(--bad);background:var(--bad-soft)}
.calib .danger b{color:var(--bad)}
details.rev{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.rev summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rev summary::-webkit-details-marker{display:none}
details.rev .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.mark{font:700 13px var(--f-mono);flex:none;width:18px}
.mark.ok{color:var(--ok)} .mark.ko{color:var(--bad)}
/* simulateur */
.simbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.clock{font:600 22px var(--f-mono);font-variant-numeric:tabular-nums}
.clock.warn{color:var(--bad)}
.pace{font-size:13px;color:var(--muted)}
.grid80{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:14px}
.grid80 button{font:600 12px var(--f-mono);height:32px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;padding:0}
.grid80 button.ans{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.grid80 button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.grid80 button.cur{outline:2px solid var(--ink);outline-offset:1px}
.atable{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.atable th,.atable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.atable th{font:700 11.5px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.atable td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.tablewrap{overflow-x:auto}
/* carnet */
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.box b{font:800 30px var(--f-display);display:block;font-variant-numeric:tabular-nums}
.box span{font-size:13px;color:var(--muted)}
.box.b1{border-top:4px solid var(--bad)} .box.b2{border-top:4px solid var(--warn)} .box.b3{border-top:4px solid var(--accent)} .box.b4{border-top:4px solid var(--ok)}
/* éclair */
.flash{text-align:center;padding:28px 20px}
.flash .stmt{font:700 clamp(20px,3vw,28px)/1.3 var(--f-display);max-width:32ch;margin:14px auto 22px}
.timer{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:420px;margin:0 auto}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.flash .row{justify-content:center}
.flash .btn{min-width:150px;font-size:16px;padding:12px 18px}
/* fiches */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid > *{min-width:0}
.fgrid .full{grid-column:1/-1}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.clean li::marker{color:var(--accent)}
.sub{columns:2;column-gap:24px;font-size:14.5px;color:var(--muted);margin:0;padding-left:18px}
/* cheat sheet */
.cs{columns:3 300px;column-gap:14px}
.cs .panel{break-inside:avoid;margin-bottom:14px;padding:16px}
.cs h3{margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cs h3 small{font:500 11px var(--f-mono);color:var(--muted)}
.cs table{width:100%;border-collapse:collapse;font-size:14px}
.cs td,.cs th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.cs th{font:700 11.5px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cs tr:last-child td{border-bottom:none}
.cs ol,.cs ul{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.formula{font:500 14px var(--f-mono);background:var(--sunk);padding:6px 10px;border-radius:6px;margin:4px 0}
.cs select{font:14px var(--f-body);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
/* glossaire */
.gtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.gtools input{font:16px var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);flex:1;min-width:200px}
.gtools select{font:14px var(--f-body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.gitem{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.gitem .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gitem .t b{font-weight:700}
.gitem .t span{font:500 11px var(--f-mono);color:var(--muted);flex:none}
.gitem .fr{font-size:13.5px;color:var(--accent)}
.gitem p{margin:0;font-size:14px;color:var(--muted)}
.empty{color:var(--muted);padding:20px;text-align:center}
.foot{color:var(--muted);font-size:13px;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--accent)}
@media (max-width:760px){
  .hero,.twocol,.fgrid{grid-template-columns:1fr}
  .sub{columns:1}
  .label{min-width:100%}
  .qtext{font-size:17px}
  header.top{position:static}
  .simbar{top:env(safe-area-inset-top,0px)}
  .boxes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mrow{grid-template-columns:110px 1fr 64px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* nouveaux onglets */
ol.seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.seq li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
ol.seq li .pos{font:600 13px var(--f-mono);color:var(--muted);text-align:center}
ol.seq li .st{min-width:0}
ol.seq li .mv{display:flex;gap:4px}
ol.seq li.right{border-color:var(--ok);background:var(--ok-soft)}
ol.seq li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.assoc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.assoc > *{min-width:0}
.acol{display:flex;flex-direction:column;gap:8px}
.assoc .opt{min-height:52px;align-items:center}
.heat-h,.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:340px}
.heat-h{margin-top:12px;font:600 11px var(--f-mono);color:var(--muted);text-align:center}
.heat{margin-top:4px}
.hc{aspect-ratio:1;border-radius:4px;background:var(--sunk);max-width:100%}
.hc.l1{background:color-mix(in srgb,var(--accent) 30%,var(--sunk))}
.hc.l2{background:color-mix(in srgb,var(--accent) 60%,var(--sunk))}
.hc.l3{background:var(--accent)}
.hc.fut{background:transparent;border:1px dashed var(--line)}
.hc.sw{width:14px;height:14px;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
textarea.code{width:100%;min-height:90px;margin-top:10px;font:13px/1.4 var(--f-mono);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink);word-break:break-all;resize:vertical}
@media (max-width:760px){.assoc .opt{font-size:14.5px;padding:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><b>PSM <i>I</i></b><span>Portail de révision · Scrum.org · Scrum Guide 2020</span></div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-v="accueil">Accueil</button>
    <button data-v="quiz">Quiz FR</button>
    <button data-v="english">Quiz EN</button>

function startItem(){flash.ans=null;flash.t0=Date.now();clearInterval(flash.tid);renderFlash();flash.tid=setInterval(()=>{const p=1-(Date.now()-flash.t0)/8000;const bar=$('#tbar');if(bar)bar.style.width=Math.max(0,p*100)+'%';if(p<=0&&!flash.ans)pickFlash(null)},100)}
function pickFlash(v){if(!flash||flash.ans)return;clearInterval(flash.tid);const it=flash.items[flash.i];const ok=v===it[1];flash.ans={v,ok};if(ok)flash.score++;flash.log.push({it,ok,v});renderFlash()}
function nextFlash(){if(!flash.ans)return;if(flash.i<flash.items.length-1){flash.i++;startItem()}else{flash.done=true;const b=store.get('psm:flashbest',null);if(b==null||flash.score>b)store.set('psm:flashbest',flash.score);logSession('Guide ou mythe ?',flash.score,20);renderFlashEnd()}}
function renderFlash(){
 if(flash.done)return renderFlashEnd();
 const it=flash.items[flash.i],a=flash.ans;
 app.innerHTML=`
 <div class="qhead"><span>Guide ou mythe ?</span><span>${flash.i+1}/20 · score ${flash.score}</span></div>
 <div class="progress"><i style="width:${(flash.i+(a?1:0))/20*100}%"></i></div>
 <div class="panel flash">
  <div class="timer"><i id="tbar" style="width:${a?0:100}%"></i></div>
  <div class="stmt">${esc(it[0])}</div>
  ${a?`<div class="feedback" style="max-width:560px;margin:0 auto;text-align:left"><div class="verdict ${a.ok?'ok':'ko'}">${a.v===null?'Temps écoulé. ':''}${a.ok?'Exact.':'Raté.'} C'est ${it[1]?'écrit dans le Scrum Guide':'un mythe'}.</div><div>${esc(it[2])}</div></div>
  <div class="row" style="margin-top:18px"><button class="btn primary" id="fnext">${flash.i<19?'Suivant':'Voir le score'}</button></div>`
  :`<div class="row"><button class="btn primary" id="fv">Guide 2020 (V)</button><button class="btn" id="ff">Mythe (F)</button></div>`}
 </div>`;
 const v=$('#fv');if(v){v.onclick=()=>pickFlash(true);$('#ff').onclick=()=>pickFlash(false)}
 const n=$('#fnext');if(n)n.onclick=nextFlash;
}
function renderFlashEnd(){
 const f=flash;
 app.innerHTML=`
 <div class="panel"><div class="result-hero"><div class="ring" style="--p:${f.score*5}"><b>${f.score}/20</b></div>
 <div class="stack" style="gap:8px"><div class="eyebrow">Guide ou mythe ?</div><h2>${f.score>=18?'Chasseur de mythes confirmé':f.score>=15?'Bon réflexe, quelques pièges à revoir':'Relisez le Scrum Guide et la cheat sheet'}</h2></div></div>
 <div class="row" style="margin-top:16px"><button class="btn primary" id="fagain">Rejouer</button><button class="btn" id="fcs">Ouvrir la cheat sheet</button></div></div>
 <div class="stack" style="gap:8px;margin-top:20px">${f.log.map((l,i)=>`<details class="rev" ${l.ok?'':'open'}><summary><span class="mark ${l.ok?'ok':'ko'}">${l.ok?'✓':'✗'}</span><span>${i+1}. ${esc(l.it[0])}</span></summary><div class="body"><div><b>${l.it[1]?'Guide 2020':'Mythe'}</b> · ${esc(l.it[2])}</div></div></details>`).join('')}</div>`;
 $('#fagain').onclick=()=>{flash=null;viewFlash()};
 $('#fcs').onclick=()=>{flash=null;go('cheatsheet')};
}

/* ---------- Le bon ordre ---------- */
const ORDRE=[
["Les événements dans un Sprint",2,["Sprint Planning","Daily Scrums","Sprint Review","Sprint Retrospective"],"Le Sprint contient tous les événements. Il s'ouvre par le Sprint Planning, se poursuit par des Daily Scrums et se conclut par la Review puis la Retrospective."],
["Les trois sujets du Sprint Planning",2,["Pourquoi ce Sprint a-t-il de la valeur ? (Sprint Goal)","Que peut-on terminer dans ce Sprint ? (éléments sélectionnés)","Comment le travail choisi sera-t-il réalisé ? (plan)"],"Sujet 1 : pourquoi ; sujet 2 : quoi ; sujet 3 : comment. Le Sprint Goal est finalisé avant la fin du Planning."],
["Le cycle empirique",8,["Transparence : rendre le travail et le processus visibles","Inspection : examiner artefacts et progression","Adaptation : ajuster dès que possible"],"L'inspection sans transparence est trompeuse ; l'adaptation suit l'inspection."],
["Le parcours d'un élément du Product Backlog",12,["Ajouté au Product Backlog","Raffiné : décomposé, décrit, dimensionné","Ordonné par le Product Owner","Sélectionné au Sprint Planning","Décomposé par les Developers dans le Sprint Backlog","Répond à la Definition of Done : un Increment naît","Présenté aux parties prenantes à la Sprint Review"],"Un élément devient Increment dès qu'il répond à la DoD ; il peut être livré avant la Review."],
["L'annulation d'un Sprint",2,["Le Sprint Goal devient obsolète","Le Product Owner décide d'annuler le Sprint","Les éléments Done sont examinés et peuvent être livrés","Les éléments non terminés retournent au Product Backlog","Un nouveau Sprint Planning démarre"],"Seul le PO peut annuler un Sprint, et seulement si le Sprint Goal devient obsolète."],
["Le déroulé d'une Sprint Review",2,["La Scrum Team présente les résultats de son travail aux parties prenantes clés","La progression vers le Product Goal est discutée","Les participants collaborent sur ce qu'il faut faire ensuite","Le Product Backlog est ajusté pour saisir de nouvelles opportunités"],"La Review est une session de travail, pas une simple présentation."],
["Le déroulé d'une Sprint Retrospective",2,["Inspecter comment s'est passé le dernier Sprint (individus, interactions, processus, outils, DoD)","Identifier ce qui a bien fonctionné et les problèmes rencontrés","Choisir les améliorations les plus utiles","Ajouter les améliorations au Sprint Backlog du Sprint suivant si besoin"],"Les améliorations les plus impactantes sont traitées dès que possible."],
["La construction du Sprint Backlog",9,["Le PO propose comment le produit pourrait gagner en valeur","La Scrum Team définit le Sprint Goal","Les Developers sélectionnent les éléments du Product Backlog","Les Developers planifient le travail, souvent en unités d'un jour ou moins"],"Sprint Backlog = Sprint Goal (pourquoi) + éléments sélectionnés (quoi) + plan (comment)."],
["Le traitement d'un obstacle",7,["Un Developer rencontre un obstacle","L'obstacle est rendu visible, par exemple au Daily Scrum","L'équipe tente de le résoudre elle-même","Si l'obstacle dépasse l'équipe, le Scrum Master en provoque la suppression","L'équipe vérifie que l'obstacle est levé et reprend sa progression"],"Le SM provoque la suppression des obstacles ; il ne retire pas tout lui-même."],
["Le passage à plusieurs équipes",1,["La Scrum Team dépasse une taille efficace","Elle se réorganise en plusieurs Scrum Teams cohérentes","Les équipes partagent le même Product Goal, Product Backlog et Product Owner","Elles définissent ensemble une Definition of Done commune","Elles produisent un Increment intégré"],"Un produit, un Product Owner, un Product Backlog, une DoD commune."],
["La demande d'une partie prenante",6,["Une partie prenante exprime un besoin","Elle en discute avec le Product Owner","Le PO décide de l'ajouter et de son ordre dans le Product Backlog","L'élément est raffiné avec les Developers","Il peut être sélectionné lors d'un prochain Sprint Planning"],"Pour changer le Product Backlog, il faut convaincre le Product Owner."],
["Des objectifs du plus long au plus court terme",9,["Product Goal : objectif à long terme dans le Product Backlog","Sprint Goal : objectif unique du Sprint","Plan d'action du jour adapté au Daily Scrum"],"Chaque niveau sert le précédent : le Sprint rapproche du Product Goal, le Daily rapproche du Sprint Goal."]

let ordre=null;
function viewOrdre(){
 if(ordre&&!ordre.done)return renderOrdre();
 app.innerHTML=`<div class="eyebrow">Nouvel onglet · séquences Scrum</div><h1>Le bon ordre</h1>
 <p class="lede">Remettez dans l'ordre chronologique les étapes de ${ORDRE.length} processus Scrum : événements du Sprint, Sprint Planning, parcours d'un élément du backlog, annulation d'un Sprint, Review, Retrospective, obstacles, mise à l'échelle… Déplacez les étapes avec les flèches, puis vérifiez.</p>
 ${ordre&&ordre.done?`<div class="panel" style="margin-top:20px"><h3>Dernière série : ${ordre.score}/${ordre.items.length} processus parfaitement ordonnés</h3></div>`:''}
 <div class="panel" style="margin-top:20px"><div class="row"><button class="btn primary" id="ogo">Lancer les ${ORDRE.length} processus</button><button class="btn" id="ogo6">Série courte de 6</button></div>
 <p style="font-size:13px;color:var(--muted);margin:10px 0 0">Record : ${store.get('psm:ordrebest',null)==null?'—':store.get('psm:ordrebest')+' processus parfaits'}</p></div>`;
 const st=n=>{ordre={items:shuffle(ORDRE).slice(0,n),i:0,score:0,done:false};newOrdreItem()};

}
function newOrdreItem(){const it=ordre.items[ordre.i];let p=shuffle(it[2].map((_,k)=>k));while(p.every((v,k)=>v===k)&&p.length>1)p=shuffle(p);ordre.perm=p;ordre.checked=false;renderOrdre()}
function renderOrdre(){
 const it=ordre.items[ordre.i],p=ordre.perm,ch=ordre.checked;
 const ok=ch&&p.every((v,k)=>v===k);
 app.innerHTML=`<div class="qhead"><span>Le bon ordre · thème ${it[1]} · ${esc(META[it[1]].fr)}</span><span>${ordre.i+1}/${ordre.items.length} · ${ordre.score} parfait(s)</span></div>
 <div class="progress"><i style="width:${(ordre.i+(ch?1:0))/ordre.items.length*100}%"></i></div>
 <div class="panel"><p class="qtext">${esc(it[0])}</p>
 <ol class="seq">${p.map((v,k)=>`<li class="${ch?(v===k?'right':'wrong'):''}"><span class="pos">${k+1}</span><span class="st">${esc(it[2][v])}</span>${ch?(v===k?'':`<span class="mono" style="font-size:12px;color:var(--bad)">→ ${v+1}</span>`):`<span class="mv"><button class="btn sm" data-u="${k}" ${k===0?'disabled':''} aria-label="Monter">↑</button><button class="btn sm" data-d="${k}" ${k===p.length-1?'disabled':''} aria-label="Descendre">↓</button></span>`}</li>`).join('')}</ol>
 ${ch?`<div class="feedback"><div class="verdict ${ok?'ok':'ko'}">${ok?'Ordre parfait.':`${p.filter((v,k)=>v===k).length}/${p.length} étapes bien placées. Le nombre à droite indique la bonne position.`}</div>
 ${ok?'':`<div><b>Ordre correct :</b><ol style="margin:4px 0 0;padding-left:20px">${it[2].map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`}<div class="rex"><b>À retenir</b>${esc(it[3])}</div></div>`:''}
 <div class="qnav"><button class="btn" id="oquit">Quitter</button>${ch?`<button class="btn primary" id="onext">${ordre.i<ordre.items.length-1?'Processus suivant':'Voir le score'}</button>`:`<button class="btn primary" id="ock">Vérifier l'ordre</button>`}</div></div>`;
 app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const k=+b.dataset.u;[p[k-1],p[k]]=[p[k],p[k-1]];renderOrdre()});
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const k=+b.dataset.d;[p[k+1],p[k]]=[p[k],p[k+1]];renderOrdre()});
 const c=$('#ock');if(c)c.onclick=()=>{ordre.checked=true;if(p.every((v,k)=>v===k))ordre.score++;bumpDay(1);renderOrdre()};
 const n=$('#onext');if(n)n.onclick=()=>{if(ordre.i<ordre.items.length-1){ordre.i++;newOrdreItem()}else{ordre.done=true;const b=store.get('psm:ordrebest',null);if(b==null||ordre.score>b)store.set('psm:ordrebest',ordre.score);logSession('Le bon ordre',ordre.score,ordre.items.length);viewOrdre()}};
 $('#oquit').onclick=()=>{ordre=null;viewOrdre()};
}

/* ---------- Atelier formules ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nf=(x,d)=>Number(x).toLocaleString('fr-FR',{maximumFractionDigits:d==null?2:d});
const FORM={
 score:{n:"Score PSM I",g(){const c=R(58,79),p=c/80*100;return {q:`Vous obtenez <b>${c}</b> bonnes réponses sur 80 à un examen blanc. Quel est votre score en pourcentage ? (une décimale)`,a:Math.round(p*10)/10,tol:.05,u:'%',s:`Score = bonnes réponses ÷ 80 × 100 = ${c} ÷ 80 × 100 = <b>${nf(p,1)} %</b>.<br>Seuil : 85 % = 68/80. ${c>=68?`Réussi, avec ${c-68} réponse(s) de marge.`:`Échec : il manque ${68-c} bonne(s) réponse(s).`}`}}},
 seuil:{n:"Bonnes réponses minimales",g(){const q=[20,30,40,50,60,80][R(0,5)],m=Math.ceil(q*.85-1e-9);return {q:`Un examen blanc compte <b>${q}</b> questions avec le seuil PSM I de 85 %. Combien de bonnes réponses faut-il au minimum ?`,a:m,tol:0,u:'bonnes réponses',s:`Minimum = arrondi supérieur de ${q} × 0,85 = arrondi sup. de ${nf(q*.85)} = <b>${m}</b>.<br>Erreurs autorisées : ${q} − ${m} = ${q-m}. Sur l'examen réel : 68/80, soit 12 erreurs au maximum.`}}},
 rythme:{n:"Gestion du temps",g(){const m=R(15,50),a=Math.min(79,Math.round(m*80/60)+R(-12,6));const v=(60-m)*60/(80-a);return {q:`Après <b>${m} minutes</b>, vous avez répondu à <b>${a}</b> questions sur 80. Combien de secondes vous reste-t-il en moyenne par question restante ? (arrondi à l'unité)`,a:Math.round(v),tol:1,u:'s',s:`Temps restant = (60 − ${m}) × 60 = ${(60-m)*60} s. Questions restantes = 80 − ${a} = ${80-a}.<br>Temps par question = ${(60-m)*60} ÷ ${80-a} = <b>${nf(v,1)} s</b>. Rythme cible : 45 s. ${v>=45?'Vous êtes dans les temps.':'Accélérez et marquez les questions difficiles pour y revenir.'}`}}},
 canaux:{n:"Canaux de communication",g(){const n=R(3,16),c=n*(n-1)/2;return {q:`Une équipe compte <b>${n}</b> personnes. Combien de canaux de communication possibles existe-t-il entre elles ? (formule n(n−1)/2)`,a:c,tol:0,u:'canaux',s:`Canaux = n(n−1)/2 = ${n} × ${n-1} ÷ 2 = <b>${c}</b>.<br>À 10 personnes : 45 canaux ; à 15 : 105. C'est l'une des raisons pour lesquelles le Scrum Guide recommande une Scrum Team de 10 personnes ou moins.`}}},
 prevision:{n:"Prévision empirique",g(){const k=R(3,5),th=Array.from({length:k},()=>R(6,14)),avg=th.reduce((x,y)=>x+y,0)/k,rest=R(30,90),sp=Math.ceil(rest/avg),mx=Math.max(...th),mn=Math.min(...th);return {q:`Les ${k} derniers Sprints ont terminé <b>${th.join(', ')}</b> éléments. Il reste <b>${rest}</b> éléments pour atteindre le Product Goal. Combien de Sprints faut-il prévoir au rythme moyen ? (arrondi supérieur)`,a:sp,tol:0,u:'Sprints',s:`Débit moyen = (${th.join(' + ')}) ÷ ${k} = ${nf(avg)} éléments par Sprint.<br>Sprints = arrondi sup. de ${rest} ÷ ${nf(avg)} = <b>${sp}</b>.<br>Fourchette honnête : ${Math.ceil(rest/mx)} Sprints au meilleur débit (${mx}) à ${Math.ceil(rest/mn)} au plus faible (${mn}). Seul ce qui s'est déjà passé sert à la prévision ; on la révise à chaque Sprint.`}}},
 little:{n:"Loi de Little (flux)",g(){const t=[1,1.5,2,2.5,3,4][R(0,5)],w=R(4,18),c=w/t;return {q:`Le travail en cours (WIP) est de <b>${w}</b> éléments et le débit moyen de <b>${nf(t)}</b> éléments par jour. Quel est le temps de cycle moyen en jours ? (une décimale)`,a:Math.round(c*10)/10,tol:.05,u:'jours',s:`Loi de Little : temps de cycle = WIP ÷ débit = ${w} ÷ ${nf(t)} = <b>${nf(c,1)} jours</b>.<br>Réduire le WIP raccourcit le temps de cycle. Métriques décrites dans le Kanban Guide for Scrum Teams (pratique complémentaire).`}}},
 daily:{n:"Timebox du Daily Scrum",g(){const j=[5,10,15,20][R(0,3)];return {q:`Un Sprint compte <b>${j}</b> jours ouvrés. Quel est le temps maximal cumulé consacré au Daily Scrum sur tout le Sprint, en minutes ?`,a:j*15,tol:0,u:'min',s:`Daily Scrum = 15 min par jour ouvré, quelle que soit la taille de l'équipe.<br>Total = ${j} × 15 = <b>${j*15} min</b>, soit ${nf(j*15/60)} h.`}}},
 capacite:{n:"Capacité du Sprint",g(){const d=R(3,8),j=[5,10,15][R(0,2)],a=R(0,Math.floor(d*j/4)),c=d*j-a;return {q:`<b>${d}</b> Developers, un Sprint de <b>${j}</b> jours ouvrés et <b>${a}</b> jours-personne d'absence prévus (congés, formation). Quelle est la capacité en jours-personne ?`,a:c,tol:0,u:'jours-personne',s:`Capacité = Developers × jours − absences = ${d} × ${j} − ${a} = <b>${c} jours-personne</b>.<br>Au Sprint Planning, les Developers sélectionnent le volume en tenant compte de leur capacité, de leur performance passée et de la DoD.`}}}
};
let fx=null,ftype=store.get('psm:ftype','all');
function newFx(){const keys=ftype==='all'?Object.keys(FORM):[ftype];const k=keys[R(0,keys.length-1)];fx={k,...FORM[k].g(),done:false,val:''}}
function viewFormules(){
 if(!fx)newFx();
 const st=store.get('psm:formstat',{});const tot=Object.values(st).reduce((x,y)=>({n:x.n+y.n,c:x.c+y.c}),{n:0,c:0});
 app.innerHTML=`<div class="eyebrow">Nouvel onglet · exercices chiffrés générés à l'infini</div><h1>Atelier formules</h1>
 <p class="lede">Calculs utiles au PSM I et à la pratique de Scrum : score et seuil d'examen, gestion des 60 minutes, canaux de communication, prévision empirique, loi de Little, timebox et capacité. Correction détaillée après chaque réponse.</p>
 <div class="chips" style="display:flex;flex-wrap:wrap;gap:6px;margin:16px 0"><button class="chip" data-t="all" aria-pressed="${ftype==='all'}">Tous</button>${Object.keys(FORM).map(k=>`<button class="chip" data-t="${k}" aria-pressed="${ftype===k}">${FORM[k].n}</button>`).join('')}</div>
 <div class="panel"><div class="qhead"><span>${FORM[fx.k].n}</span><span>Réussite cumulée : ${tot.c}/${tot.n}</span></div>
 <p class="qtext" style="margin-top:10px">${fx.q}</p>

let asc=null;
function viewAssoc(){
 if(asc&&!asc.done)return renderAssoc();
 const b=store.get('psm:assocbest',null);
 app.innerHTML=`<div class="eyebrow">Nouvel onglet · vocabulaire de l'examen</div><h1>Associations éclair</h1>
 <p class="lede">Reliez 6 termes anglais du glossaire à leur traduction, le plus vite possible. Cliquez un terme, puis sa traduction. Chaque erreur ajoute 5 secondes de pénalité.</p>
 <div class="panel flash" style="margin-top:20px"><div class="eyebrow">${b==null?'Pas encore de record':'Record : '+nf(b,1)+' s'}</div>
 <div class="stmt">6 paires, un chrono, un record à battre.</div><div class="row"><button class="btn primary" id="ago">Commencer</button></div></div>
 ${asc&&asc.done?`<div class="panel" style="margin-top:16px"><h3>Dernière manche : ${nf(asc.final,1)} s (${nf(asc.time,1)} s + ${asc.err} erreur(s) × 5 s)${asc.rec?' · nouveau record':''}</h3>
 <ul class="clean" style="margin-top:10px">${asc.items.map(g=>`<li><b>${esc(g[0])}</b> → ${esc(g[1])} · <span style="color:var(--muted)">${esc(g[2])}</span></li>`).join('')}</ul></div>`:''}`;
 $('#ago').onclick=()=>{const pool=GLOSS.filter(g=>g[0].toLowerCase()!==g[1].toLowerCase());const seen=new Set(),items=[];shuffle(pool).forEach(g=>{if(items.length<6&&!seen.has(g[1])){seen.add(g[1]);items.push(g)}});
  asc={items,right:shuffle(items.map((_,i)=>i)),matched:[],selL:null,err:0,t0:Date.now(),done:false,bad:null};renderAssoc();clearInterval(asc.tid);asc.tid=setInterval(()=>{if(!asc||asc.done||current!=='assoc'){if(asc)clearInterval(asc.tid);return}const c=$('#achrono');if(c)c.textContent=nf((Date.now()-asc.t0)/1000,1)+' s'},100)};
}
function renderAssoc(){
 const a=asc;
 app.innerHTML=`<div class="qhead"><span>Associations éclair</span><span>${a.matched.length}/6 · ${a.err} erreur(s)</span></div>
 <div class="progress"><i style="width:${a.matched.length/6*100}%"></i></div>
 <div class="panel"><div class="row" style="justify-content:space-between"><span class="clock" id="achrono">0,0 s</span><button class="btn sm" id="aquit">Abandonner</button></div>
 <div class="assoc"><div class="acol">${a.items.map((g,i)=>`<button class="opt ${a.matched.includes(i)?'right':a.selL===i?'sel':''}" data-l="${i}" ${a.matched.includes(i)?'disabled':''}><span lang="en">${esc(g[0])}</span></button>`).join('')}</div>
 <div class="acol">${a.right.map(i=>`<button class="opt ${a.matched.includes(i)?'right':a.bad===i?'wrong':''}" data-r="${i}" ${a.matched.includes(i)?'disabled':''}><span>${esc(a.items[i][1])}</span></button>`).join('')}</div></div></div>`;
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{a.selL=+b.dataset.l;a.bad=null;renderAssoc()});
 app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(a.selL==null)return;const r=+b.dataset.r;if(r===a.selL){a.matched.push(r);a.selL=null;a.bad=null;bumpDay(1);if(a.matched.length===6)return endAssoc()}else{a.err++;a.bad=r}renderAssoc()});
 $('#aquit').onclick=()=>{clearInterval(a.tid);asc=null;viewAssoc()};
 const c=$('#achrono');if(c)c.textContent=nf((Date.now()-a.t0)/1000,1)+' s';
}
function endAssoc(){const a=asc;clearInterval(a.tid);a.done=true;a.time=(Date.now()-a.t0)/1000;a.final=a.time+5*a.err;const b=store.get('psm:assocbest',null);a.rec=b==null||a.final<b;if(a.rec)store.set('psm:assocbest',Math.round(a.final*10)/10);logSession('Associations éclair',Math.round(a.final*10)/10,'s');viewAssoc()}

{t:"Le Daily Scrum de 45 minutes",lieu:"Dakar, Sénégal",org:"TéléSahel, opérateur télécom",a:[2,10],ctx:"Le Daily Scrum de l'équipe « facturation » dure 45 minutes : chaque Developer rend compte au responsable du service. La direction propose des Sprints de 6 semaines pour « avoir le temps de livrer », et la Sprint Review sert de comité de validation avant mise en production.",
d:[["Comment faire évoluer le Daily Scrum ?",["Le recentrer sur la progression vers le Sprint Goal, en 15 minutes, entre Developers, les discussions détaillées ayant lieu après","Le garder à 45 minutes puisque tout le monde est informé","Le tenir une fois par semaine pour gagner du temps","Confier l'animation obligatoire au Scrum Master"],"Le Daily Scrum dure 15 minutes et appartient aux Developers ; ce n'est pas un reporting au management."],
["Que répondre à la proposition de Sprints de 6 semaines ?",["Les Sprints durent un mois ou moins ; des Sprints plus courts réduisent le risque et accélèrent les retours","Accepter : la durée est libre","Accepter seulement pour le premier Sprint","Passer à des Sprints de 3 mois avec une phase de test"],"Un Sprint dure un mois ou moins. Plus il est long, plus le Sprint Goal risque de devenir invalide."],
["Comment repositionner la Sprint Review ?",["En faire une session de travail avec les parties prenantes et permettre la livraison dès qu'un Increment est Done","La conserver comme porte d'approbation obligatoire","La supprimer au profit d'un e-mail","La transformer en revue de performance de l'équipe"],"La Sprint Review ne doit jamais être une gate de livraison ; un Increment Done peut être livré avant la fin du Sprint."]]},
{t:"Presque terminé à la fin du Sprint",lieu:"Lomé, Togo",org:"Plateforme logistique portuaire",a:[5,9],ctx:"À la fin du Sprint, trois fonctionnalités de suivi des conteneurs sont « codées mais pas testées ». Le directeur du port veut les voir à la Sprint Review et propose d'alléger la Definition of Done pour le Sprint suivant afin de tenir une échéance douanière.",
d:[["Que faire des trois fonctionnalités non testées ?",["Elles ne sont ni présentées ni livrées ; elles retournent au Product Backlog","Les présenter comme terminées à 90 %","Prolonger le Sprint de trois jours","Les livrer avec une liste de bugs connus"],"Un élément qui ne répond pas à la DoD ne peut pas être présenté à la Sprint Review."],
["Le directeur veut alléger la Definition of Done. Quelle est la réponse ?",["La qualité ne diminue pas ; on renégocie plutôt le périmètre avec le Product Owner","Accepter pour ce seul Sprint","Laisser chaque Developer choisir ses critères","Supprimer les tests automatisés pour aller plus vite"],"Pendant le Sprint, la qualité ne diminue pas. Le levier est le périmètre, pas la DoD."],
["Une deuxième équipe rejoint le produit. Que devient la DoD ?",["Les deux équipes définissent ensemble une DoD commune et la respectent","Chaque équipe garde la sienne","La nouvelle équipe adopte une DoD allégée le temps de monter en compétence","Le Product Owner écrit une DoD par équipe"],"Plusieurs Scrum Teams sur un même produit partagent une même Definition of Done."]]},
{t:"Le directeur général et le Sprint Backlog",lieu:"Bamako, Mali",org:"Institution de microfinance",a:[12,13],ctx:"Le directeur général ajoute directement des éléments dans le Sprint Backlog en cours. Le Product Backlog compte 400 éléments jamais revus. Le conseil d'administration mesure la réussite au nombre de fonctionnalités livrées.",
d:[["Comment traiter les ajouts du directeur général ?",["Le Scrum Master l'aide à passer par le Product Owner, qui décide de l'ordre dans le Product Backlog","Les Developers les intègrent, c'est le DG","Le Scrum Master supprime les ajouts sans explication","Le Sprint est annulé automatiquement"],"Le Sprint Backlog appartient aux Developers ; toute demande passe par le Product Owner."],
["Que faire des 400 éléments jamais revus ?",["Le PO, avec les Developers, raffine et ordonne le haut du backlog et retire les éléments devenus inutiles","Les estimer tous en story points avant de continuer","Les garder intacts : on ne supprime rien","Laisser le Scrum Master les trier"],"Le Product Backlog est une liste émergente et ordonnée ; sa gestion efficace est l'accountability du PO."],

{t:"Une date ferme pour le guichet numérique",lieu:"Cotonou, Bénin",org:"Agence de services publics numériques",a:[4,6],ctx:"Le ministère exige une date ferme pour la mise en ligne de tout le guichet numérique. Aucun usager n'assiste aux Sprint Reviews, et un conseiller technique du ministère contacte directement les Developers pour ajouter des écrans.",
d:[["Comment répondre à l'exigence de date ferme ?",["Le PO partage une prévision fondée sur le débit réel des Sprints, présentée en fourchette et révisée à chaque Review","S'engager sur la date et tout le périmètre","Ajouter dix Developers pour sécuriser la date","Planifier tous les Sprints dans le détail dès maintenant"],"Dans un environnement complexe, seul ce qui s'est déjà passé sert aux décisions tournées vers l'avenir."],
["Comment améliorer les Sprint Reviews ?",["Inviter des usagers et des agents de guichet pour inspecter l'Increment et adapter le Product Backlog","Garder une démonstration interne entre Developers","Remplacer la Review par un rapport écrit au ministère","Organiser la Review seulement à la fin du projet"],"La Review est le lieu de collaboration avec les parties prenantes clés."],
["Le conseiller contacte directement les Developers. Que faire ?",["Les Developers le redirigent vers le Product Owner, et le Scrum Master facilite cette collaboration","Les Developers ajoutent les écrans en urgence","Le Scrum Master lui interdit tout contact avec l'équipe","Le conseiller devient co-Product Owner"],"Pour changer le Product Backlog, il faut convaincre le Product Owner ; le SM rapproche parties prenantes et équipe."]]},
{t:"L'équipe qui attend les ordres",lieu:"Ouagadougou, Burkina Faso",org:"Startup agritech (conseils météo par SMS)",a:[3,7],ctx:"Nouvellement formée, l'équipe attend que le Scrum Master lui dise quoi faire. Le manager demande un rapport individuel hebdomadaire. Depuis trois Sprints, le Sprint Goal n'est pas atteint.",

["Le manager veut un rapport individuel hebdomadaire. Que faire ?",["Lui expliquer la transparence apportée par les artefacts et l'inviter à la Sprint Review","Produire le rapport chaque semaine","Demander à chaque Developer un e-mail quotidien","Refuser sans explication"],"Scrum apporte la transparence par ses artefacts et événements ; le SM aide l'organisation à comprendre l'empirisme."],
["Le Sprint Goal est manqué depuis trois Sprints. Premier réflexe ?",["Aider l'équipe à en inspecter les causes en Retrospective, avec des questions ouvertes","Réduire d'office la durée des Sprints","Signaler l'équipe à la direction","Demander au PO des objectifs plus faciles"],"Le coaching fait émerger les causes et les solutions de l'équipe elle-même."]]},
{t:"La dette technique cachée",lieu:"Conakry, Guinée",org:"Clinique, dossier patient informatisé",a:[8,11],ctx:"Pour tenir les délais, des Developers ont caché au Product Owner une dette technique importante. Un Developer n'ose pas dire au directeur médical qu'une fonctionnalité demandée mettrait en danger la qualité des données. L'équipe ne s'ajuste qu'en Retrospective.",

["L'équipe ne s'adapte qu'en Retrospective. Que rappeler ?",["On s'adapte dès que possible lorsqu'un écart dépasse les limites acceptables","C'est la règle : l'adaptation se fait seulement en Retrospective","On attend la fin de la release","On attend l'accord du management"],"Les événements formalisent l'adaptation, ils ne l'interdisent pas entre eux."]]},

 </div>
 <section class="panel" style="margin-top:16px"><h3>Historique des séances</h3>
 ${hist.length?`<div class="tablewrap"><table class="atable"><tr><th>Date</th><th>Heure</th><th>Module</th><th style="text-align:right">Résultat</th></tr>${hist.slice(-25).reverse().map(h=>`<tr><td>${esc(h.d)}</td><td>${esc(h.h)}</td><td>${esc(h.m)}</td><td class="n">${h.t==='s'?nf(h.s,1)+' s':h.s+'/'+h.t}</td></tr>`).join('')}</table></div>`:'<p class="empty">Aucune séance pour l\'instant. Terminez un quiz, un examen blanc ou un atelier pour la voir ici.</p>'}</section>
 <section class="panel" style="margin-top:16px"><h3>Code de sauvegarde</h3>
 <p style="margin:6px 0 10px;font-size:14.5px;color:var(--muted)">Copiez ce code sur l'appareil d'origine, puis collez-le sur le nouvel appareil et cliquez sur Restaurer. Il contient scores, carnet d'erreurs, historique, records, plan et objectifs.</p>
 <div class="row"><button class="btn primary" id="bkgen">Générer mon code</button><button class="btn" id="bkcopy" hidden>Copier le code</button><span id="bkmsg" style="font-size:13.5px;color:var(--muted)"></span></div>
 <textarea id="bkout" readonly hidden aria-label="Code de sauvegarde" class="code"></textarea>
 <label for="bkin" style="display:block;font-weight:700;margin:16px 0 6px">Restaurer depuis un code</label>
 <textarea id="bkin" class="code" placeholder="Collez ici un code qui commence par PSM1-"></textarea>
 <div class="row" style="margin-top:8px"><button class="btn" id="bkrest">Restaurer</button><span id="bkrmsg" style="font-size:13.5px"></span></div></section>`;
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{store.set('psm:goal',+b.dataset.g);viewProgres()});
 $('#bkgen').onclick=()=>{const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('psm:'))o[k]=localStorage.getItem(k)}}catch(e){}
  const code='PSM1-'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));const out=$('#bkout');out.value=code;out.hidden=false;$('#bkcopy').hidden=false;$('#bkmsg').textContent=Object.keys(o).length+' éléments sauvegardés · '+code.length+' caractères';out.select()};
 $('#bkcopy').onclick=()=>{const out=$('#bkout');const ok=()=>{$('#bkmsg').textContent='Code copié.'};const fb=()=>{out.focus();out.select();$('#bkmsg').textContent='Code sélectionné : copiez-le avec Ctrl+C ou un appui long.'};try{navigator.clipboard.writeText(out.value).then(ok,fb)}catch(e){fb()}};
 $('#bkrest').onclick=function(){const m=$('#bkrmsg');const raw=$('#bkin').value.trim();if(!raw.startsWith('PSM1-')){m.style.color='var(--bad)';m.textContent='Code invalide : il doit commencer par PSM1-.';return}
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(raw.slice(5)))))}catch(e){m.style.color='var(--bad)';m.textContent='Code illisible : vérifiez qu\'il a été copié en entier.';return}
  if(!this.dataset.c){this.dataset.c='1';this.textContent='Confirmer : remplacer la progression de cet appareil';m.style.color='var(--warn)';m.textContent=Object.keys(o).length+' éléments trouvés.';return}
  try{Object.keys(localStorage).filter(k=>k.startsWith('psm:')).forEach(k=>localStorage.removeItem(k));Object.keys(o).forEach(k=>{if(k.startsWith('psm:'))localStorage.setItem(k,o[k])})}catch(e){m.style.color='var(--bad)';m.textContent='Restauration impossible : le stockage du navigateur est bloqué.';return}
  viewProgres();const mm=$('#bkrmsg');mm.style.color='var(--ok)';mm.textContent='Progression restaurée.'};
}
Object.assign(views,{ordre:viewOrdre,formules:viewFormules,assoc:viewAssoc,cas:viewCas,progres:viewProgres});

const start=(location.hash||'').replace('#','');
go(views[start]?start:'accueil');
})();
</script>
